<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Be My Valentine?</title>
  <style>
    :root{
      /* Orange + Green palette */
      --bg1:#FFE7C7;         /* soft orange */
      --bg2:#D6F5E3;         /* soft mint green */
      --card:#ffffffcc;
      --text:#1f2937;

      --yes:#F97316;         /* orange */
      --yesShadow: rgba(249,115,22,.35);

      --no:#DCFCE7;          /* pale green */
      --noText:#065F46;      /* deep green */
      --noShadow: rgba(6,95,70,.18);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
    }
    .card{
      width:min(680px, 92vw);
      padding:32px 22px;
      background:var(--card);
      backdrop-filter: blur(8px);
      border:1px solid #ffffff80;
      border-radius:20px;
      box-shadow:0 18px 60px rgba(0,0,0,.12);
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    h1{
      margin:0 0 10px;
      font-size: clamp(28px, 4vw, 44px);
      line-height:1.1;
    }
    p{
      margin:0 0 22px;
      font-size: clamp(16px, 2.2vw, 18px);
      opacity:.9;
    }

    .buttons{
      display:flex;
      gap:14px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      position:relative;
      padding:18px 0 6px;
      min-height:86px; /* helps when No becomes absolute */
    }

    button{
      border:0;
      border-radius:999px;
      padding:14px 26px;
      font-size:18px;
      cursor:pointer;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      user-select:none;
      touch-action: manipulation;
      position:relative;
      z-index:2; /* keep above background */
    }
    #yesBtn{
      background: var(--yes);
      color:white;
      box-shadow: 0 10px 22px var(--yesShadow);
      transform: scale(1);
    }
    #noBtn{
      background: var(--no);
      color:var(--noText);
      box-shadow: 0 10px 22px var(--noShadow);
      transform: scale(1);
      position:relative; /* becomes absolute when we start dodging */
    }

    button:hover{filter: brightness(1.03)}
    button:active{transform: translateY(1px) scale(var(--scale, 1))}

    .msg{
      margin-top:16px;
      min-height:28px;
      font-size:18px;
      font-weight:600;
    }

    .hearts{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.55;
      background:
        radial-gradient(circle at 20% 15%, rgba(249,115,22,.22) 0 8px, transparent 9px),
        radial-gradient(circle at 80% 25%, rgba(6,95,70,.18) 0 6px, transparent 7px),
        radial-gradient(circle at 30% 80%, rgba(249,115,22,.16) 0 7px, transparent 8px),
        radial-gradient(circle at 70% 75%, rgba(6,95,70,.14) 0 6px, transparent 7px);
      filter: blur(.2px);
      z-index:0;
    }

    .success{
      font-size: clamp(18px, 2.5vw, 22px);
    }

    .float-heart{
      position:absolute;
      left:50%;
      top:55%;
      transform: translate(-50%, -50%);
      font-size: 22px;
      pointer-events:none;
      animation: floatUp 900ms ease-out forwards;
      opacity: 0.95;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.12));
      z-index:3;
    }
    @keyframes floatUp{
      from { transform: translate(-50%, -50%) translateY(0) scale(1); opacity: .95; }
      to   { transform: translate(-50%, -50%) translateY(-90px) scale(1.6); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="hearts"></div>
    <h1 id="title">Hannah, will you be my valentine? 💚🧡</h1>

    <div class="buttons" id="btnArea">
      <button id="yesBtn" aria-label="Yes">Yes 🧡</button>
      <button id="noBtn" aria-label="No">No 🙃</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const msg    = document.getElementById("msg");
    const card   = document.getElementById("card");
    const btnArea= document.getElementById("btnArea");
    const title  = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");

    let noCount = 0;
    let yesScale = 1;
    let noScale  = 1;

    const noMessages = [
      "Are you sure? 🥺",
      "Wait… really? 😳",
      "But think of Jacks and Evangeline",
      "No button seems tired…",
      "But think of the heated blankets",
      "Think of the cuddles",
      "Please be my beautiful baby girl"
    ];

    function applyScales() {
      yesBtn.style.transform = `scale(${yesScale})`;
      noBtn.style.transform  = `scale(${noScale})`;
    }

    // --- Collision helpers: prevent No from overlapping Yes ---
    function rectsOverlap(a, b, padding = 10){
      return !(
        a.right  < b.left  + padding ||
        a.left   > b.right - padding ||
        a.bottom < b.top   + padding ||
        a.top    > b.bottom- padding
      );
    }

    function getBounds() {
      const areaW = btnArea.clientWidth;
      const areaH = btnArea.clientHeight;
      const btnW  = noBtn.offsetWidth;
      const btnH  = noBtn.offsetHeight;

      return {
        maxLeft: Math.max(0, areaW - btnW),
        maxTop:  Math.max(0, areaH - btnH)
      };
    }

    function clamp(n, min, max){ return Math.min(max, Math.max(min, n)); }
    function px(v){ return Number(String(v || "0").replace("px","")) || 0; }

    function placeNoSafely(preferLeft, preferTop){
      const { maxLeft, maxTop } = getBounds();

      // Yes button rect in the same coordinate space as btnArea
      const areaRect = btnArea.getBoundingClientRect();
      const yesRect  = yesBtn.getBoundingClientRect();
      const yesLocal = {
        left:   yesRect.left - areaRect.left,
        top:    yesRect.top  - areaRect.top,
        right:  yesRect.right- areaRect.left,
        bottom: yesRect.bottom- areaRect.top
      };

      const pad = 12;

      // Try preferred spot first, then random attempts
      const tries = [];
      if (typeof preferLeft === "number" && typeof preferTop === "number"){
        tries.push({left: preferLeft, top: preferTop});
      }
      for (let i=0;i<40;i++){
        tries.push({
          left: Math.random()*maxLeft,
          top:  Math.random()*maxTop
        });
      }

      for (const t of tries){
        const left = clamp(t.left, 0, maxLeft);
        const top  = clamp(t.top,  0, maxTop);

        // No button rect (local)
        const noLocal = {
          left,
          top,
          right: left + noBtn.offsetWidth,
          bottom: top + noBtn.offsetHeight
        };

        if (!rectsOverlap(noLocal, yesLocal, pad)){
          noBtn.style.left = `${left}px`;
          noBtn.style.top  = `${top}px`;
          return true;
        }
      }

      // Fallback: if area is too tight, push it to farthest corner from Yes
      const corners = [
        {left: 0,       top: 0},
        {left: maxLeft, top: 0},
        {left: 0,       top: maxTop},
        {left: maxLeft, top: maxTop}
      ];
      corners.sort((c1, c2) => {
        const d1 = distToYes(c1.left, c1.top, yesLocal);
        const d2 = distToYes(c2.left, c2.top, yesLocal);
        return d2 - d1;
      });

      const best = corners[0];
      noBtn.style.left = `${best.left}px`;
      noBtn.style.top  = `${best.top}px`;
      return false;
    }

    function distToYes(noLeft, noTop, yesLocal){
      const noCx = noLeft + noBtn.offsetWidth/2;
      const noCy = noTop  + noBtn.offsetHeight/2;
      const yesCx = (yesLocal.left + yesLocal.right)/2;
      const yesCy = (yesLocal.top  + yesLocal.bottom)/2;
      const dx = noCx - yesCx, dy = noCy - yesCy;
      return Math.hypot(dx, dy);
    }

    // Make the No button smaller + Yes bigger whenever she tries clicking No
    noBtn.addEventListener("click", () => {
      noCount++;

      yesScale = Math.min(yesScale + 0.14, 2.6);
      noScale  = Math.max(noScale  - 0.12, 0.28);

      applyScales();

      msg.textContent = noMessages[Math.min(noCount - 1, noMessages.length - 1)];

      if (noCount >= 3) enableDodge();
    });

    // Dodging
    let dodgeEnabled = false;

    function enableDodge() {
      if (dodgeEnabled) return;
      dodgeEnabled = true;

      noBtn.style.position = "absolute";

      // Put it near where it already is (but not overlapping Yes)
      const areaRect = btnArea.getBoundingClientRect();
      const noRect = noBtn.getBoundingClientRect();
      const startLeft = noRect.left - areaRect.left;
      const startTop  = noRect.top  - areaRect.top;

      // Make sure it doesn't start overlapping
      placeNoSafely(startLeft, startTop);

      const moveHandler = (ev) => {
        if (Math.random() < 0.08) return; // tiny chance it stays put
        dodgeNoButton(ev);
      };

      noBtn.addEventListener("mouseenter", moveHandler);
      noBtn.addEventListener("pointerdown", moveHandler);

      window.addEventListener("resize", keepNoInBoundsAndSeparated);
    }

    function keepNoInBoundsAndSeparated() {
      if (!dodgeEnabled) return;

      const { maxLeft, maxTop } = getBounds();
      const curLeft = px(noBtn.style.left);
      const curTop  = px(noBtn.style.top);

      // Clamp into bounds, then ensure separation from Yes
      const clampedLeft = clamp(curLeft, 0, maxLeft);
      const clampedTop  = clamp(curTop, 0, maxTop);
      placeNoSafely(clampedLeft, clampedTop);
    }

    function dodgeNoButton(ev) {
      const { maxLeft, maxTop } = getBounds();
      const areaRect = btnArea.getBoundingClientRect();

      const pointerX = ev?.clientX ?? (areaRect.left + areaRect.width / 2);
      const pointerY = ev?.clientY ?? (areaRect.top + areaRect.height / 2);

      const currentLeft = px(noBtn.style.left);
      const currentTop  = px(noBtn.style.top);

      // Vector away from pointer + randomness
      const btnCenterX = areaRect.left + currentLeft + noBtn.offsetWidth / 2;
      const btnCenterY = areaRect.top  + currentTop  + noBtn.offsetHeight / 2;
      const dx = btnCenterX - pointerX;
      const dy = btnCenterY - pointerY;

      const intensity = Math.min(1 + noCount * 0.18, 2.5);
      let nextLeft = currentLeft + dx * 0.35 * intensity + (Math.random() - 0.5) * 40;
      let nextTop  = currentTop  + dy * 0.35 * intensity + (Math.random() - 0.5) * 30;

      nextLeft = clamp(nextLeft, 0, maxLeft);
      nextTop  = clamp(nextTop,  0, maxTop);

      // Place with overlap avoidance (impossible to overlap Yes)
      placeNoSafely(nextLeft, nextTop);
    }

    // YES = celebrate + lock in (long distance friendly message)
    yesBtn.addEventListener("click", () => {
      msg.innerHTML = `<span class="success">YAYYY!! 🧡💚</span>`;
      title.textContent = "It’s a long-distance Valentine!";
      subtitle.innerHTML = `
      I can’t wait to celebrate with you (even from Houghton to Ames)
      <div style="font-size:14px; opacity:.7; margin-top:6px;">
      I love you the mostest^mostest^♾️^♾️^jackangeline!!!!
      </div>
      `;

      yesBtn.disabled = true;
      noBtn.disabled = true;

      noBtn.style.opacity = "0.5";
      noBtn.style.cursor = "not-allowed";
      
      btnArea.style.display = "none";

      popHearts(18);

      setTimeout(() => {
        btnArea.innerHTML = `<div class="success">Sending you a million hugs 🧡💚</div>`;
      }, 900);
    });

    function popHearts(count = 12){
      const emojis = ["🧡","💚","💛","💖","💘","✨"];
      for (let i=0;i<count;i++){
        const h = document.createElement("div");
        h.className = "float-heart";
        h.textContent = emojis[Math.floor(Math.random()*emojis.length)];

        const x = 15 + Math.random()*70;  // percent
        const y = 55 + Math.random()*20;  // percent
        h.style.left = x + "%";
        h.style.top  = y + "%";
        h.style.animationDelay = (Math.random()*180) + "ms";
        h.style.fontSize = (18 + Math.random()*20) + "px";

        card.appendChild(h);
        h.addEventListener("animationend", () => h.remove());
      }
    }
  </script>
</body>
</html>
